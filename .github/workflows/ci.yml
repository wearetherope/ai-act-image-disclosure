name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP lint ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check
        run: |
          set -e
          for f in $(git ls-files '*.php'); do php -l "$f"; done

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The check derives the plugin slug from the folder name. The repository is
      # ai-act-image-disclosure but the plugin slug is different, so
      # the distributable is staged in a folder with the right name.
      - name: Stage the plugin under its slug
        run: |
          mkdir -p /tmp/stage/ropemark-image-marking-for-eu-ai-act
          rsync -a --exclude-from=.distignore --exclude .git ./ /tmp/stage/ropemark-image-marking-for-eu-ai-act/
          rm -rf ropemark-image-marking-for-eu-ai-act && cp -R /tmp/stage/ropemark-image-marking-for-eu-ai-act ropemark-image-marking-for-eu-ai-act
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ropemark-image-marking-for-eu-ai-act
          exclude-directories: '.github,.wordpress-org'
          exclude-files: 'phpcs.xml.dist,.distignore,.gitignore'
          # load_plugin_textdomain() is kept on purpose for the bundled Italian translation.
          ignore-codes: 'PluginCheck.CodeAnalysis.DiscouragedFunctions.load_plugin_textdomainFound'
